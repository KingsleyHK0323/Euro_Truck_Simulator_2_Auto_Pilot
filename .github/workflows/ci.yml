# Each module job runs only when its directory exists, so CI can go live before the code does.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.d.outputs.native }}
      python: ${{ steps.d.outputs.python }}
      ui: ${{ steps.d.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        run: |
          native=false
          python=false
          ui=false
          if [ -f native/CMakeLists.txt ]; then native=true; fi
          if [ -d python/ets2ap ] && [ -d python/tests ]; then python=true; fi
          for f in ui/*.sln ui/*.slnx; do
            if [ -f "$f" ]; then ui=true; break; fi
          done
          {
            echo "native=$native"
            echo "python=$python"
            echo "ui=$ui"
          } >> "$GITHUB_OUTPUT"

  native:
    needs: detect
    if: needs.detect.outputs.native == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: cmake -S native -B build/native -A x64
      - run: cmake --build build/native --config Release
      - name: Run native tests with the Control.v1 Python smoke client
        shell: pwsh
        run: |
          $pythonPath = (python -c "import sys; print(sys.executable)").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($pythonPath) -or -not (Test-Path -LiteralPath $pythonPath -PathType Leaf)) { throw 'Python smoke client executable was not found.' }
          $env:ETS2AP_TEST_PYTHON = $pythonPath
          ctest --test-dir build/native -C Release --output-on-failure

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m compileall -q ets2ap tests
      - run: python -m unittest discover -s tests -v

  ui:
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release -m:1
      - run: dotnet test -c Release --no-build -m:1
      - run: dotnet run --project checks/ETS2AP.Ui.Checks.csproj -c Release --no-build
